name: Deploy site to GitHub Pages

# Rebuilds the seed-data JSON and deploys the static tools site.
# GitHub Pages must be enabled once in repo Settings -> Pages -> Source: "GitHub Actions".
# By default the github-pages environment only deploys from the default branch (main).

on:
  push:
    branches: ["main", "claude/bold-babbage-5ErWG"]
    paths:
      - "site/**"
      - "data/seed/**"
      - "src/vinifera/**"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build site data from seed CSVs
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
