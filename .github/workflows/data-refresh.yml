name: Refresh sourced data

# Runs the network-dependent data pipeline on GitHub's runners (which HAVE outbound
# network, unlike the in-session sandbox), then commits the compact sourced outputs back.
# Currently pulls Open-Meteo weather and derives per-region climate. The FPS/Anderson
# loaders (scripts/sources/) are run manually until their live selectors are confirmed.

on:
  workflow_dispatch:
  # Uncomment to refresh on a schedule (monthly):
  # schedule:
  #   - cron: "0 5 1 * *"

permissions:
  contents: write

concurrency:
  group: "data-refresh-${{ github.ref_name }}"
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Pull historical weather (Open-Meteo ERA5)
        run: python scripts/fetch_weather.py

      - name: Build per-region climate + variation score
        run: python scripts/build_climate.py

      - name: Rebuild relational database (integrity check)
        run: python scripts/build_db.py

      - name: Commit sourced outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/interim/anchor_climate.csv data/processed/region_climate.csv \
                  data/db/varieties.csv data/db/variety_region.csv data/PROVENANCE.md
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Refresh sourced climate data [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
